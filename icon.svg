<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Stock review">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132444"/>
      <stop offset="1" stop-color="#0b1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c99b45"/>
      <stop offset="1" stop-color="#f7d58b"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)" stroke="#f5c063" stroke-opacity=".45" stroke-width="1.5"/>
  <!-- 上涨柱 -->
  <rect x="12" y="34" width="7" height="18" rx="1.6" fill="#ff5b5b" opacity=".9"/>
  <rect x="12" y="30" width="7" height="2.5" rx="1" fill="#ff5b5b" opacity=".55"/>
  <!-- 中间柱 -->
  <rect x="23" y="26" width="7" height="26" rx="1.6" fill="url(#gold)"/>
  <rect x="23" y="21.5" width="7" height="2.5" rx="1" fill="#f5c063" opacity=".6"/>
  <!-- 右侧柱 -->
  <rect x="34" y="38" width="7" height="14" rx="1.6" fill="#2ecc8f" opacity=".9"/>
  <rect x="34" y="34" width="7" height="2.5" rx="1" fill="#2ecc8f" opacity=".55"/>
  <!-- 趋势线 -->
  <path d="M9 44 L20 34 L31 37 L42 22 L55 15" fill="none" stroke="#f5c063" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="55" cy="15" r="3.4" fill="#f5c063"/>
  <circle cx="55" cy="15" r="7" fill="none" stroke="#f5c063" stroke-opacity=".35" stroke-width="1.4"/>
</svg>
